# Biodata Maker — automatic language page generator
#
# Runs on GitHub's servers whenever index.html changes. Regenerates the
# twelve language landing pages, sitemap.xml and robots.txt, then commits
# them back. You never run anything locally.
name: Build language pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'build.js'
      - '.github/workflows/build-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate language pages
        env:
          # Change this when you move to a custom domain.
          SITE_URL: https://koljacks.github.io/biodata
        run: node build.js
      - name: Commit the result
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A hi mr gu bn ta te kn ml pa or ur en about privacy terms contact \
            sitemap.xml robots.txt 404.html manifest.json sw.js icon-192.png icon-512.png apple-touch-icon.png
          if git diff --staged --quiet; then
            echo "Nothing changed — skipping commit."
          else
            git commit -m "Rebuild language pages [skip ci]"
            git push
          fi
